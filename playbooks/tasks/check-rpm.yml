---
- name: "Check the staged {{ rpm_release }} file"
  ansible.builtin.stat:
    path: "{{ redis_stage }}/redis-{{ rpm_release }}.{{ ansible_facts['architecture'] }}.rpm"
    checksum_algorithm: sha256
  register: staged

- name: "Verify the approved digest for {{ rpm_release }}"
  ansible.builtin.assert:
    that:
      - staged.stat.isreg | default(false)
      - staged.stat.checksum == redis_checksums[ansible_facts['architecture']][rpm_release]
      - staged.stat.uid == 0
      - not staged.stat.wgrp and not staged.stat.woth

- name: Read the staged RPM name and build
  ansible.builtin.command:
    argv: [rpm, -qp, --queryformat, "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}", "{{ staged.stat.path }}"]
  changed_when: false
  register: rpm_header

- name: Match the artifact identity to the change
  ansible.builtin.assert:
    that:
      - rpm_header.stdout == 'redis-' ~ rpm_release ~ '.' ~ ansible_facts['architecture']
