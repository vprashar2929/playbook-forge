---
- name: Exercise a failed Redis host window while Kafka stays online
  hosts: redis
  become: true
  vars:
    fixture: /etc/systemd/system/redis.service.d/90-forge-drill.conf
    hold_path: /var/lib/playbook-forge-os.hold
  tasks:
    - name: Verify both guests are the disposable lab
      ansible.builtin.slurp:
        src: /etc/playbook-forge-lab
      delegate_to: "{{ item }}"
      loop: [lima-forge-redis, lima-forge-kafka]
      register: markers

    - name: Check for an existing hold or fixture
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ [hold_path, fixture] }}"
      register: paths

    - name: Require the lab inventory and a bootable baseline
      ansible.builtin.assert:
        that:
          - groups['patch_targets'] == ['lima-forge-redis','lima-forge-kafka']
          - markers.results | map(attribute='content') | map('b64decode') | map('trim') | unique | list == ['local-patching-pilot-v1']
          - ansible_facts['kernel'] != patch_kernel
          - paths.results | selectattr('stat.exists') | list | length == 0

    - name: Record Kafka boot and package state before the failure
      ansible.builtin.command: "{{ item }}"
      loop: [cat /proc/sys/kernel/random/boot_id, rpm -q kernel-core]
      delegate_to: lima-forge-kafka
      register: kafka_before
      changed_when: false

    - name: Create a systemd drop-in directory for the drill
      ansible.builtin.file:
        path: /etc/systemd/system/redis.service.d
        state: directory
        mode: '0755'

    - name: Test the real two-host playbook and targeted recovery
      block:
        - name: Prevent Redis startup under the approved target kernel
          ansible.builtin.copy:
            dest: "{{ fixture }}"
            mode: '0644'
            content: |
              [Unit]
              ConditionKernelVersion=!{{ patch_kernel }}

        - name: Reload the fault fixture
          ansible.builtin.systemd_service: {daemon_reload: true}

        - name: Run the ordinary window against both guests
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: ["{{ playbook_dir }}/../scripts/run-patch", -i, "{{ inventory_file }}", -e, patch_apply=true]
          register: patch
          failed_when: patch.rc != 2 or 'Maintenance held on lima-forge-redis' not in patch.stdout

        - name: Verify that the failure happened after booting the approved kernel
          ansible.builtin.command: uname -r
          register: booted
          changed_when: false
          failed_when: booted.stdout != patch_kernel

        - name: Require Kafka to retain its original boot ID and installed kernels
          ansible.builtin.command: "{{ item.item }}"
          delegate_to: lima-forge-kafka
          loop: "{{ kafka_before.results }}"
          loop_control: {label: "{{ item.item }}"}
          register: kafka_after
          failed_when: kafka_after.rc != 0 or kafka_after.stdout != item.stdout
          changed_when: false

        - name: Run the approved retained-kernel recovery on Redis alone
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            argv: ["{{ playbook_dir }}/../scripts/run-patch", --recover, -i, "{{ inventory_file }}", --limit, "{{ inventory_hostname }}"]

        - name: Check that the reviewed host stays held after recovery
          ansible.builtin.stat:
            path: "{{ hold_path }}/window.json"
          register: held
        - ansible.builtin.assert:
            that: held.stat.isreg | default(false)
      always:
        - name: Remove the lab-only fixture
          ansible.builtin.file: {path: "{{ fixture }}", state: absent}
        - name: Restore the normal service definition
          ansible.builtin.systemd_service: {daemon_reload: true}
