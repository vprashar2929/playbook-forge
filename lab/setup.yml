---
- name: Prepare the disposable Redis and Kafka lab
  hosts: lab
  become: true
  any_errors_fatal: true
  vars:
    kafka_version: 4.4.0
    kafka_dir: "/opt/kafka_2.13-{{ kafka_version }}"
    kafka_archive: "kafka_2.13-{{ kafka_version }}.tgz"
    kafka_sha512: f5ceba8a265ab6bb2d68362b1f6859a95e15d60ef92ba83b43fdf065b557dc18e98d6383c15b9977320e25b3a2c8b6f11decb17b0fa6c0f163423793a0eb95cb
  tasks:
    - name: Read the identity marker supplied by the Lima template
      ansible.builtin.slurp:
        src: /etc/playbook-forge-lab
      register: lab_marker

    - name: Confirm the intended disposable guest
      ansible.builtin.assert:
        that:
          - lab_marker.content | b64decode | trim == 'local-patching-pilot-v1'
          - ansible_facts['hostname'] == expected_hostname
          - ansible_facts['distribution'] == 'Rocky'
          - ansible_facts['distribution_major_version'] == '9'

    - name: Create the guest package staging directory
      ansible.builtin.file:
        path: "{{ redis_stage }}"
        state: directory
        mode: '0755'

    - name: Stage both signed Redis builds from the Rocky archive
      ansible.builtin.get_url:
        url: "https://download.rockylinux.org/vault/rocky/9.8/AppStream/{{ ansible_facts['architecture'] }}/os/Packages/r/{{ rpm_file }}"
        dest: "{{ redis_stage }}/{{ rpm_file }}"
        checksum: "sha256:{{ redis_checksums[ansible_facts['architecture']][item] }}"
        mode: '0644'
        timeout: 90
      vars:
        rpm_file: "redis-{{ item }}.{{ ansible_facts['architecture'] }}.rpm"
      loop: "{{ [redis_from, redis_to] }}"

    - name: Trust the Rocky package signing key from the verified guest image
      ansible.builtin.rpm_key:
        key: /etc/pki/rpm-gpg/RPM-GPG-KEY-Rocky-9
        state: present

    - name: Read installed packages
      ansible.builtin.package_facts:
        manager: rpm

    - name: Install the starting Redis version only on first installation
      ansible.builtin.dnf:
        name: "{{ redis_stage }}/redis-{{ redis_from }}.{{ ansible_facts['architecture'] }}.rpm"
        state: present
      when: "'redis' not in ansible_facts['packages']"

    - name: Install the reboot checker and Kafka JVM
      ansible.builtin.dnf:
        name: [dnf-plugins-core, java-21-openjdk-headless]
        state: present

    - name: Create the Kafka service account
      ansible.builtin.user:
        name: kafka
        system: true
        home: /var/lib/kafka
        create_home: false
        shell: /sbin/nologin

    - name: Create Kafka directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        mode: '0755'
      loop:
        - {path: /etc/kafka, owner: root}
        - {path: /var/lib/kafka, owner: kafka}
        - {path: /var/log/kafka, owner: kafka}

    - name: Download the pinned Kafka distribution
      ansible.builtin.get_url:
        url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_archive }}"
        dest: "/var/cache/{{ kafka_archive }}"
        checksum: "sha512:{{ kafka_sha512 }}"
        mode: '0644'
        timeout: 180

    - name: Extract the verified distribution
      ansible.builtin.unarchive:
        src: "/var/cache/{{ kafka_archive }}"
        remote_src: true
        dest: /opt
        creates: "{{ kafka_dir }}/bin/kafka-server-start.sh"
        owner: root
        group: root

    - name: Link the installed Kafka distribution
      ansible.builtin.file:
        src: "{{ kafka_dir }}"
        dest: /opt/kafka
        state: link

    - name: Install single-node KRaft settings
      ansible.builtin.copy:
        dest: /etc/kafka/server.properties
        mode: '0644'
        content: |
          process.roles=broker,controller
          node.id=1
          controller.listener.names=CONTROLLER
          listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
          advertised.listeners=PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
          controller.quorum.bootstrap.servers=127.0.0.1:9093
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          inter.broker.listener.name=PLAINTEXT
          log.dirs=/var/lib/kafka
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          share.coordinator.state.topic.replication.factor=1
          share.coordinator.state.topic.min.isr=1
      notify: Restart Kafka

    - name: Check for existing KRaft storage
      ansible.builtin.stat:
        path: /var/lib/kafka/meta.properties
      register: kafka_storage

    - name: Initialize new KRaft storage
      when: not kafka_storage.stat.exists
      block:
        - name: Generate the cluster identity
          ansible.builtin.command: /opt/kafka/bin/kafka-storage.sh random-uuid
          register: kafka_id
          changed_when: false

        - name: Format the empty lab broker
          ansible.builtin.command:
            argv: [runuser, -u, kafka, --, /opt/kafka/bin/kafka-storage.sh, format, --standalone, -t, "{{ kafka_id.stdout | trim }}", -c, /etc/kafka/server.properties]
          environment:
            LOG_DIR: /var/log/kafka

    - name: Install the Kafka systemd unit
      ansible.builtin.copy:
        src: kafka.service
        dest: /etc/systemd/system/kafka.service
        mode: '0644'
      notify: Restart Kafka

    - name: Apply pending unit changes
      ansible.builtin.meta: flush_handlers

    - name: Enable both services across reboots
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [redis, kafka]

    - name: Verify both services
      ansible.builtin.import_tasks: ../playbooks/tasks/health.yml

  handlers:
    - name: Restart Kafka
      ansible.builtin.systemd_service:
        name: kafka
        daemon_reload: true
        state: restarted
