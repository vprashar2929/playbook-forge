all:
  children:
    patch_targets:
      children:
        redis:
          hosts:
            lima-forge-redis:
              expected_hostname: lima-forge-redis
              ansible_ssh_common_args: >-
                -F "{{ lookup('env', 'LIMA_HOME') | default(lookup('env', 'HOME') ~ '/.lima', true) }}/forge-redis/ssh.config"
              patch_role: redis
              config_paths: [/etc/redis/redis.conf]
        kafka:
          hosts:
            lima-forge-kafka:
              expected_hostname: lima-forge-kafka
              ansible_ssh_common_args: >-
                -F "{{ lookup('env', 'LIMA_HOME') | default(lookup('env', 'HOME') ~ '/.lima', true) }}/forge-kafka/ssh.config"
              patch_role: kafka
              config_paths: [/etc/kafka, /etc/systemd/system/kafka.service]
    lab:
      children:
        patch_targets: {}
